version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: jackdany-app_server_1
      APP_PORT: 3000

  server:
    build: ./server
    image: jackdany-app:latest
    restart: on-failure
    user: "1000:1000"
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - JWT_SECRET=${APP_SEED}
      - ADMIN_USER=admin
      # Imposta al primo avvio via env Umbrel o cambia da dashboard.
      # Se vuota, default: jackdany-admin (cambiare subito!)
      - ADMIN_PASSWORD=
